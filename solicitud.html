<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar acompañamiento | Consultoría Dietética Valenzuela</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <div class="logo-container">
        <img src="images/logosinfondo.png" 
             alt="Consultoría Dietética Valenzuela"
             class="logo-img">
    </div>


    <nav class="nav-izquierda">

        <div class="enlaces-menu">

            <a href="index.html#inicio">Inicio</a>
            <a href="sobre-mi.html">Sobre mí</a>
            <a href="index.html#como-trabajo">Cómo Trabajo</a>
            <a href="index.html#contacto">Contacto</a>

        </div>

    </nav>

</header>



<section class="solicitud">


    <div class="solicitud-header">

        <h1>
            Empieza tu cambio hoy
        </h1>


        <p>
            Solicita tu acompañamiento personalizado y da el primer paso 
            hacia una alimentación más sencilla, sostenible y adaptada a ti.
        </p>


    </div>



    <form class="formulario-solicitud">


        <label>
            Plan seleccionado
        </label>

        <input type="text" id="plan" name="plan" readonly>



        <label>
            Nombre
        </label>

        <input type="text" name="nombre" required>



        <label>
            Apellidos
        </label>

        <input type="text" name="apellidos" required>



        <label>
            Correo electrónico
        </label>

        <input type="email" name="email" required>



        <label>
            Teléfono
        </label>

        <input type="tel" name="telefono">



        <label>
            Edad
        </label>

        <input type="number" name="edad">



        <label>
            Altura (cm)
        </label>

        <input type="number" name="altura">



        <label>
            Peso actual (kg)
        </label>

        <input type="number" name="peso">



        <label>
            ¿Cuál es tu objetivo?
        </label>


        <select name="objetivo">

            <option>Pérdida de grasa</option>
            <option>Ganancia muscular</option>
            <option>Mejorar hábitos</option>
            <option>Rendimiento deportivo</option>
            <option>Otro</option>

        </select>



        <label>
            Cuéntame un poco sobre ti
        </label>


        <textarea 
        name="mensaje"
        rows="6"
        placeholder="Cuéntame qué objetivo quieres conseguir, qué dificultades tienes actualmente o cualquier información importante">
        </textarea>



        <label class="privacidad">

            <input type="checkbox" required>

            Acepto la política de privacidad.

        </label>



        <button type="submit">
            Enviar solicitud
        </button>


    </form>


</section>




<script>

const parametros = new URLSearchParams(window.location.search);

const plan = parametros.get("plan");


if(plan){

document.getElementById("plan").value = plan;

}

</script>



</body>

</html>
